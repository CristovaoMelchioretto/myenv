<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
    <title>MyEnv</title>
    <link rel="stylesheet" href="css/estilo.css">
    <script src="js/armazenamento.js"></script>
    <script src="js/tema.js"></script>
  </head>
  <body>
    <nav class="barra-abas" aria-label="Abas">
      <span class="marca">MyEnv</span>
      <div class="abas" role="tablist">
        <button id="abaInicio" class="aba aba-inicio ativa" type="button" role="tab" aria-selected="true">Links</button>
        <div id="abasAbertas" class="abas-abertas"></div>
      </div>
      <button id="btnDividir" class="icone" type="button" hidden>
        <svg class="icone-svg" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <path d="M12 4v16"/>
        </svg>
      </button>
      <button id="btnTema" class="icone" type="button">
        <svg class="icone-svg sol" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5"/>
          <path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/>
        </svg>
        <svg class="icone-svg lua" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/>
        </svg>
      </button>
    </nav>

    <section id="inicio" class="inicio">
      <header class="cabecalho">
        <div class="barra">
          <input id="busca" type="search" placeholder="Buscar cliente, nome ou URL (Ctrl+K)" autocomplete="off">
          <select id="filtroAmbiente" aria-label="Filtrar ambiente">
            <option value="">Todos os ambientes</option>
            <option value="producao">Produção</option>
            <option value="homologacao">Homologação</option>
            <option value="desenvolvimento">Desenvolvimento</option>
            <option value="outro">Outro</option>
          </select>
          <button id="btnNovo" class="primario" type="button">+ Novo link</button>
          <button id="btnExportar" type="button" title="Salvar backup em JSON">Exportar</button>
          <button id="btnImportar" type="button" title="Carregar backup em JSON">Importar</button>
          <input id="arquivoImportar" type="file" accept=".json,application/json" hidden>
        </div>
      </header>

      <main id="lista" class="lista"></main>

      <p class="aviso">
        Os links ficam salvos somente neste computador.
        Use <b>Exportar</b> de vez em quando para guardar um backup (.json).
        <span class="dica-app">Clique abre no app, <b>Shift</b>+clique abre ao lado e <b>Ctrl</b>+clique abre no navegador.</span>
      </p>
    </section>

    <section id="trabalho" class="trabalho" hidden>
      <div class="painel" data-lado="esquerda">
        <div class="painel-topo"></div>
        <div class="painel-corpo">
          <div class="painel-mensagem" hidden></div>
        </div>
      </div>
      <div class="painel" data-lado="direita" hidden>
        <div class="painel-topo"></div>
        <div class="painel-corpo">
          <div class="painel-mensagem" hidden></div>
        </div>
      </div>
    </section>

    <dialog id="dlg">
      <form id="frm" method="dialog">
        <h3 id="dlgTitulo">Novo link</h3>
        <label>
          Cliente
          <input name="cliente" list="clientes" required>
        </label>
        <datalist id="clientes"></datalist>
        <label>
          Nome
          <input name="nome" required placeholder="Ex.: Portal do cliente">
        </label>
        <label>
          URL
          <input name="url" type="url" required placeholder="https://">
        </label>
        <label>
          Ambiente
          <select name="ambiente">
            <option value="producao">Produção</option>
            <option value="homologacao">Homologação</option>
            <option value="desenvolvimento">Desenvolvimento</option>
            <option value="outro">Outro</option>
          </select>
        </label>
        <label>
          Observação
          <textarea name="obs" rows="2"></textarea>
        </label>
        <div class="rodape">
          <button id="btnCancelar" type="button">Cancelar</button>
          <button class="primario" type="submit">Salvar</button>
        </div>
      </form>
    </dialog>

    <div id="toast" role="status" aria-live="polite"></div>

    <script src="js/comum.js"></script>
    <script src="js/espaco-trabalho.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
